<!DOCTYPE html>
<html>

<head>

    <title>Welcome to DREAM CAMPUS</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            overflow:hidden;
            background:#0f172a;
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        }

        h1{
            color:white;
            font-size:70px;
            letter-spacing:5px;
            position:relative;
            animation:slideIn 3s forwards;
        }

        p{
            color:cyan;
            font-size:24px;
            margin-top:20px;
            opacity:0;
            animation:fadeIn 2s forwards;
            animation-delay:2s;
        }

        .loading{
            margin-top:50px;
            width:400px;
            height:10px;
            background:#333;
            border-radius:20px;
            overflow:hidden;
        }

        .bar{
            width:0%;
            height:100%;
            background:cyan;
            animation:load 5s linear forwards;
        }

        @keyframes slideIn{

            from{
                transform:translateX(-1200px);
            }

            to{
                transform:translateX(0);
            }
        }

        @keyframes fadeIn{

            from{
                opacity:0;
            }

            to{
                opacity:1;
            }
        }

        @keyframes load{

            from{
                width:0%;
            }

            to{
                width:100%;
            }
        }

    </style>

</head>

<body>

    <h1>🎓 DREAM CAMPUS</h1>

    <p>Your Future Begins Here</p>

    <div class="loading">

        <div class="bar"></div>

    </div>

    <script>

        setTimeout(function(){

            window.location.href = "index.html";

        },5000);

    </script>

</body>

</html>
